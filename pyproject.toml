[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refund-agent-lab"
version = "0.1.0"
description = "A local refund safety lab with durable LangGraph workflows"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["refund_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
